<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Contact</title>
  <a href="index.html" class="back-btn">Back To Home</a>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
      
    }

    body{
      background:#f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;      
    }

    .container{
      width:950px;
      background:white;
      display:flex;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 5px 20px rgba(0,0,0,0.2);
      position:relative;
    }

    /* LEFT SIDE */

    .left{
      width:35%;
      background:#060622;
      color:white;
      padding:40px 30px;
    }

    .left h2{
      margin-bottom:20px;
      font-size:30px;
    }

    .left p{
      line-height:1.8;
      color:#ddd;
      margin-bottom:30px;
    }

    .info{
      margin-bottom:20px;
      font-size:18px;
    }

    .info i{
      margin-right:10px;
      color:#1e90ff;
    }

    /* SOCIAL ICONS */

    .social{
      margin-top:50px;
    }

    .social h3{
      margin-bottom:20px;
    }

    .social a{
      text-decoration:none;
      color:white;
      font-size:22px;
      margin-right:15px;
      width:45px;
      height:45px;
      display:inline-flex;
      justify-content:center;
      align-items:center;
      border-radius:50%;
      background:#1a1a40;
      transition:0.3s;
    }

    .social a:hover{
      background:#1e90ff;
      transform:scale(1.1);
    }

    /* RIGHT SIDE */

    .right{
      width:65%;
      padding:40px;
    }

    .right h1{
      margin-bottom:30px;
      color:#222;
    }

    .row{
      display:flex;
      gap:20px;
      margin-bottom:20px;
    }

    .input-box{
      width:100%;
    }

    .input-box label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
    }

    .input-box input,
    .input-box textarea{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:5px;
      outline:none;
      font-size:16px;
    }

    textarea{
      height:130px;
      resize:none;
    }

    button{
      background:#1877ff;
      color:white;
      border:none;
      padding:14px 30px;
      border-radius:6px;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
      margin-top:15px;
    }

    button:hover{
      background:#005ce6;
    }

    /* SUCCESS POPUP */

    .popup{
      position:absolute;
      top:20px;
      right:-350px;
      background:#28a745;
      color:white;
      padding:15px 25px;
      border-radius:5px;
      font-size:16px;
      transition:0.5s;
    }

    .popup.show{
      right:20px;
    }
/* back button */
    .back-btn{
        position: fixed;
        bottom: 30px;
        right: 25px;
        background: linear-gradient(135deg, #ff512f, #dd2476);
        color: white;
        padding: 14px 26px;
        border-radius: 50px;
        text-decoration: none;
        font-size: 17px;
        font-weight: bold;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        transition: 0.3s;
        z-index: 1000;
      }
      .back-btn:hover{
        transform: scale(1.08);
        box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      }


    /* MOBILE */

    @media(max-width:768px){

      .container{
        flex-direction:column;
      }

      .left,
      .right{
        width:100%;
      }

      .row{
        flex-direction:column;
      }
      
     
    }

  </style>
</head>

<body>
<div class="container">

  <!-- POPUP -->
  <div class="popup" id="popup">
    ✅ Thank You! Message Sent Successfully
  </div>

  <!-- LEFT -->
  <div class="left">

    <h2>Contact Me</h2>

    <p>
      I'm currently looking for new opportunities.
      Whether you have a question or just want to say hi,
      I'll try my best to get back to you!
    </p>

    <div class="info">
      <i class="fa-solid fa-envelope"></i>
      ravatakshay099@gmail.com
    </div>

    <div class="info">
      <i class="fa-solid fa-location-dot"></i>
      Ahmedabad, India
    </div>

    <!-- SOCIAL ICONS -->

    <div class="social">

      <h3>FOLLOW ME</h3>
      <!-- !-- GITHUB -->
      <a href="https://github.com/RavatAkshay" target="_blank">
        <i class="fa-brands fa-github"></i>
      </a>

      <!-- LINKEDIN -->
      <a href="https://www.linkedin.com/in/akshay-ravat-770763403/" target="_blank">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>

      <!-- INSTAGRAM -->
      <a href="https://instagram.com/imakshay_2007" target="_blank">
        <i class="fa-brands fa-instagram"></i>
      </a>

    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <h1>Send me a message</h1>

    <!-- EMAIL FORM -->
    <!-- Change your email below -->

    <form id="contactForm"

      action="https://formsubmit.co/ravatakshay099@gmail.com"
      method="POST">

      <!-- Disable captcha -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="New Portfolio Contact">

      <!-- Redirect -->
      <!-- <input type="hidden" name="_next" value="https://ravatakshay.github.io/Akshay-Portfolio/thankyou.html"> -->
      <input type="hidden" name="_next" value="thankyou.html">


      <div class="row">

        <div class="input-box">
          <label>Your Name</label>
          <input type="text" name="name"
          placeholder="John Doe" required>
        </div>

        <div class="input-box">
          <label>Your Email</label>
          <input type="email" name="email"
          placeholder="john@example.com" required>
        </div>

      </div>

      <div class="input-box">
        <label>Message</label>
        <textarea name="message"
        placeholder="How can I help you?"
        required></textarea>
      </div>

      <button type="submit">
        Send Message <i class="fa-solid fa-paper-plane"></i>
      </button>


    </form>

  </div>

</div>

<script>

  const form = document.getElementById("contactForm");
  const popup = document.getElementById("popup");

  form.addEventListener("submit", function(){

    popup.classList.add("show");

    setTimeout(() => {
      popup.classList.remove("show");
    }, 3000);

  });
  


</script>

</body>
</html>
